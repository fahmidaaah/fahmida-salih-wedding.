<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5e6d5">
<title>Fahmida & Salih — Wedding Invitation</title>
<style>
:root{--wine:#710d27;--cream:#f5e6d5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2a1016;font-family:Georgia,'Times New Roman',serif}
#app{height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse,#6a3c38,#1c0b10)}
#invitation{position:relative;height:100%;width:min(100vw,56.25vh);max-width:100vw;aspect-ratio:9/16;overflow:hidden;background:var(--cream);box-shadow:0 0 40px #0008;touch-action:pan-y}
#pageImage{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;border-radius:999px;z-index:2}
.hotspot:focus-visible{outline:2px solid white;outline-offset:2px}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff9;font:11px Arial,sans-serif;letter-spacing:.12em;pointer-events:none;text-shadow:0 1px 4px #000}
#prev,#next{position:absolute;top:0;bottom:0;width:13%;z-index:1;background:transparent;border:0;cursor:pointer}
#prev{left:0}#next{right:0}
#status{position:absolute;top:8px;right:8px;z-index:4;background:#4e071db8;color:#fff;padding:5px 9px;border-radius:20px;font:10px Arial,sans-serif;letter-spacing:.08em;opacity:0;transition:opacity .3s}
#status.show{opacity:1}
@media (min-aspect-ratio:9/16){#invitation{height:100dvh;width:auto;max-width:100vw}}
@media (max-aspect-ratio:9/16){#invitation{width:100vw;height:100dvh;aspect-ratio:auto}}
</style>
</head>
<body>
<div id="app">
 <main id="invitation" aria-label="Interactive wedding invitation">
  <img id="pageImage" src="01_Sealed_Envelope.png"" alt="Fahmida and Salih wedding invitation">
  <button id="prev" aria-label="Previous page" title="Previous page"></button>
  <button id="next" aria-label="Next page" title="Next page"></button>
  <div id="status"></div>
  <div id="hint">TAP TO CONTINUE · SWIPE TO TURN PAGES</div>
 </main>
</div>
<script>
const pages = [
 {file:"01_Sealed_Envelope.png", alt:"A special invitation", hotspots:[{x:28,y:87,w:44,h:9,to:1,label:"Open invitation"}]},
 {file:"02_Opening_Surprise.png",alt:"A little surprise",hotspots:[{x:24,y:68,w:52,h:9,to:2,label:"Open"}]},
 {file:"03_Names_Invitation.png",alt:"Fahmida and Salih wedding invitation",hotspots:[{x:35,y:91,w:30,h:7,to:3,label:"Continue"}]},
 {file:"04_Date_Reveal.png",alt:"Reveal our wedding date",hotspots:[{x:29,y:81,w:42,h:7,to:4,label:"Swipe here"}]},
 {file:"05_Wedding_Date.png",alt:"Monday 23 November 2026",hotspots:[{x:0,y:0,w:100,h:100,to:5,label:"Continue"}]},
 {file:"06_Countdown.png",alt:"Counting down to our day",hotspots:[{x:0,y:0,w:100,h:100,to:6,label:"Continue"}]},
 {file:"07_Nikah_Details.png",alt:"Nikah details, 23 November 2026 at 10:30 AM",hotspots:[{x:0,y:0,w:100,h:100,to:7,label:"Continue"}]},
 {file:"08_Venue.png",alt:"Sabha Hall-Auditorium, 1st Mile, Kizhisseri, Malappuram, Kerala",hotspots:[{x:20,y:49,w:60,h:9,action:"location",label:"Open location"},{x:0,y:0,w:100,h:100,to:8,label:"Continue"}]},
 {file:"09_RSVP.png",alt:"Kindly respond",hotspots:[{x:18,y:58,w:64,h:8,action:"yes",label:"I will be there"},{x:18,y:70,w:64,h:8,action:"no",label:"Regretfully no"}]},
 {file:"10_Closing.png",alt:"Jazakum Allahu Khairan, Fahmida and Salih",hotspots:[{x:0,y:0,w:100,h:100,to:0,label:"Back to beginning"}]}
];
let current=0;
const image=document.getElementById('pageImage'), invitation=document.getElementById('invitation'), status=document.getElementById('status');
function showStatus(message){status.textContent=message;status.classList.add('show');setTimeout(()=>status.classList.remove('show'),2600)}
function render(index){
 current=(index+pages.length)%pages.length;
 const page=pages[current];
 image.src=page.file; image.alt=page.alt;
 invitation.querySelectorAll('.dynamic-hotspot').forEach(el=>el.remove());
 page.hotspots.forEach(h=>{
   const b=document.createElement('button');b.className='hotspot dynamic-hotspot';
   b.style.left=h.x+'%';b.style.top=h.y+'%';b.style.width=h.w+'%';b.style.height=h.h+'%';
   b.setAttribute('aria-label',h.label);b.title=h.label;
   b.addEventListener('click',e=>{e.stopPropagation();if(h.to!==undefined)render(h.to);else if(h.action==='location')window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Sabha Hall Auditorium, 1st Mile, Kizhisseri, Malappuram, Kerala'),'_blank');else if(h.action==='yes'){showStatus('Thank you! We look forward to seeing you.');}else if(h.action==='no'){showStatus('Thank you for letting us know.');}});
   invitation.appendChild(b);
 });
}
document.getElementById('prev').addEventListener('click',()=>render(current-1));
document.getElementById('next').addEventListener('click',()=>render(current+1));
let startX=0,startY=0;
invitation.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});
invitation.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))render(current+(dx<0?1:-1));},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();render(current-1)}});
image.addEventListener('click',()=>{if(current===4||current===5||current===6||current===9)render(current+1)});
render(0);
</script>
</body>
</html>
